<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudBus Pass</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}
nav{background:#102a43;color:white;padding:16px 6%;display:flex;justify-content:space-between;align-items:center}
nav a{color:white;text-decoration:none;margin-left:18px}
.container{max-width:1050px;margin:30px auto;padding:0 18px}
.card,.ticket,.formbox{background:white;padding:22px;border-radius:14px;box-shadow:0 5px 18px #0001}
button,.btn{background:#1769aa;color:white;border:0;padding:11px 17px;border-radius:8px;text-decoration:none;cursor:pointer}
input{width:100%;padding:11px;margin:7px 0 15px;box-sizing:border-box;border:1px solid #ccd6e0;border-radius:7px}
.seats{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:15px 0}
.seat{padding:10px;text-align:center;background:#e6f0fa;border-radius:7px}
.booked{background:#ddd;color:#888}
.alert{padding:12px;border-radius:8px;background:#ffe4e4;margin-bottom:15px}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.small{color:#607080}
</style>
</head>
<body>

<nav>
<strong>🚌 CloudBus Pass</strong>
<span>
<a href="/">Home</a>
<a href="/verify">Verify Ticket</a>
<a href="/admin">Admin</a>
</span>
</nav>

<div class="container">
{% with messages=get_flashed_messages() %}
{% for m in messages %}
<div class="alert">{{m}}</div>
{% endfor %}
{% endwith %}

{% block content %}{% endblock %}
</div>

</body>
</html>
